[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Keep the shipped .pck to game content only. Measured with pck_audit.py at 2e1af47 the release
; pck was 162.4 MiB of payload, of which tests/ + tools/ were shipped needlessly and the m_r*
; monster sheets are byte-identical duplicates of the m_s* sheets with zero references anywhere
; in scripts/ or data/ (verified by md5 + grep). Nothing excluded here is reachable at runtime.
;
; The background entries below are dead art, verified by grepping every .gd/.json/.tscn/.tres/.cfg
; for both the full filename and the bare stem: battlefield-v1 / ember-cliff-v1 /
; mountain-forge-v1 / rune-ravine-v1 are referenced nowhere at all, and the two .png halves of
; lantern-marsh-v1 and spirit-world-map-v1 are dead because those screens load the .jpg
; explicitly (game.gd:766, game_shop_deck_screen.gd:189). There is no directory scan over
; assets/backgrounds -- _background() only ever receives string literals -- so nothing resolves
; these by name at runtime. Excluded rather than deleted: the art stays in the repo, so this is
; one line to revert if it is wanted for a future chapter.
exclude_filter="build/*, tests/*, tools/*, addons/gut/*, assets/characters/monsters/m_r*.png, assets/backgrounds/battlefield-v1.*, assets/backgrounds/ember-cliff-v1.*, assets/backgrounds/mountain-forge-v1.*, assets/backgrounds/rune-ravine-v1.*, assets/backgrounds/lantern-marsh-v1.png, assets/backgrounds/spirit-world-map-v1.png"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false


name: Refresh Visual Baselines

# ---------------------------------------------------------------------------------------------
# Why this workflow exists, and why a local `./run_tests.sh --refresh-baselines` cannot replace it
# ---------------------------------------------------------------------------------------------
# Godot/tests/pixel_diff_test.gd compares a fresh capture against the committed PNGs under
# Godot/tests/snapshots/baselines/. For that comparison to mean anything, both sides have to come
# from the same rendering driver — and they don't, because "the same" is machine-dependent:
# locally this renders through Metal/opengl3 on an Apple M4, while ci.yml renders through Mesa's
# llvmpipe under Xvfb (no GPU needed). Measured today, on a *clean* tree with none of this
# session's changes applied: capturing locally and diffing against the committed baselines fails
# all 7 screens, the battle screen alone at 54% of its pixels.
#
# Two conclusions follow. First, the committed baselines were captured in CI, and that is where
# they have to stay. Second — and this is the reason for this file — refreshing them locally would
# bake one developer's GPU output into the repo and turn every CI run red from then on, and the
# obvious "fix" for that (capture locally, commit, shrug) is how a real regression gets papered
# over. So the refresh has to run here, in the same renderer that will later check the result.
#
# run_tests.sh already implemented the capture-and-promote half (`--refresh-baselines`, added with
# that exact warning attached). What was missing was any way to invoke it from CI: there was no
# such workflow, and with no authenticated `gh` CLI on the dev machine a `workflow_dispatch`-only
# workflow is not reachable from here either (no browser session, no API token). Hence the second
# trigger below: pushing any `ci/refresh-baselines*` branch runs this, and that is a trigger which
# needs nothing except the git credentials the dev machine already has. The refreshed baselines
# are pushed back onto that same branch — never straight to main — so they can be reviewed, and
# the branch merged or thrown away, before they gate anything.
#
# The verdict and the per-screen measurements are written into the commit *body*, deliberately.
# Actions logs are not readable from this machine either, so a commit message is the only channel
# that can carry "did the fresh baselines actually pass the gate they are about to gate?" back to
# whoever decides whether to merge. A baseline that cannot pass its own gate is worse than no
# baseline: it fails every future run for a reason no one can act on.
# ---------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why these baselines are being refreshed (recorded in the commit message)"
        required: false
        default: "intentional UI change"
  push:
    branches:
      # Listed explicitly as well as by glob: a glob that fails to match fails *silently* here --
      # the workflow simply never runs, with no error anywhere -- and this is the only trigger
      # reachable without an authenticated gh CLI.
      - 'ci/refresh-baselines'
      - 'ci/refresh-baselines**'

# Two pushes in quick succession would otherwise run two captures, both of which try to commit
# baselines and push to the same branch -- the loser's push is rejected. The newest run is the one
# that matters, so let it win.
concurrency:
  group: refresh-baselines-${{ github.ref_name }}
  cancel-in-progress: true

# Required to push the refreshed baselines back to the branch. The default token permissions in
# this repository are read-only, so this has to be stated explicitly or the push step 403s.
permissions:
  contents: write

jobs:
  refresh:
    name: Recapture baselines under Xvfb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      # Same reason as ci.yml: every test script references global class_name types, and Godot
      # only resolves those from its own generated cache (Godot/.godot/, gitignored — never
      # committed), so a fresh checkout needs an import pass or everything fails to parse before a
      # single line runs.
      - name: Import project (populate class_name cache)
        run: godot --headless --path Godot/ --import

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Capture needs a real display: get_image() on --headless's dummy driver returns null, so
      # there are no pixels to save. The virtual screen must also be at least as tall as the
      # game's 390x844 portrait viewport — a shorter one resolves bottom-anchored UI against the
      # wrong height and looks exactly like a genuine layout bug.
      #
      # This runs *before* the promotion below, while the committed baselines are still the OLD
      # ones, and that is the entire point: it answers "how far did this change move each screen?"
      # by diffing a fresh capture against the baselines it is about to replace. After the
      # promotion, that comparison is the new capture against itself and carries no information.
      #
      # It matters because this workflow is the only feedback channel available for an intentional
      # visual change (Actions logs are not readable from the dev machine, so a commit body is the
      # only place a number can land). Without this step the honest answer to "did that change the
      # art on screen?" is "unknown", and the tempting answer is "the new baselines pass, so no".
      # Non-blocking: these are measurements, not a gate.
      - name: Measure the move against the baselines being replaced
        id: before
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 400x900x24" ./run_tests.sh --diff > /tmp/before.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          grep -E "matches baseline|exceeded visual difference|no committed baseline|was not captured" \
            /tmp/before.log | tee /tmp/before_screen.txt || true
          if [ ! -s /tmp/before_screen.txt ]; then
            echo "(no per-screen lines: the suite did not reach its comparison stage)" > /tmp/before_screen.txt
            tail -20 /tmp/before.log
          fi

      - name: Recapture snapshots and promote them to baselines
        run: |
          chmod +x run_tests.sh
          xvfb-run -a --server-args="-screen 0 400x900x24" ./run_tests.sh --refresh-baselines

      - name: Re-import (regenerate metadata for the replaced PNGs)
        run: godot --headless --path Godot/ --import

      # The independent second pass that decides whether these baselines are usable. This captures
      # the screens again from scratch and diffs that *new* capture against the baselines promoted
      # one step ago, i.e. it asks "will this reproduce?" rather than "does this match itself?".
      # Kept non-blocking so the measurements and the diff images still get committed/uploaded
      # even when the answer is no — a failure here is information, and losing it would send us
      # back for another 6-minute round trip.
      - name: Re-check the fresh baselines against a second capture
        id: verify
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 400x900x24" ./run_tests.sh --diff > /tmp/verify.log 2>&1
          verify_status=$?
          set -e
          echo "status=${verify_status}" >> "$GITHUB_OUTPUT"
          echo "--- per-screen results ---"
          grep -E "matches baseline|exceeded visual difference|no committed baseline|was not captured" /tmp/verify.log | tee /tmp/per_screen.txt || true
          echo "--- verify tail ---"
          tail -30 /tmp/verify.log
          ls -la Godot/tests/snapshots/diffs/ 2>/dev/null || true

      - name: Compose the report that will be the commit body
        run: |
          VERIFY_STATUS="${{ steps.verify.outputs.status }}"
          if [ "${VERIFY_STATUS}" = "0" ]; then
            VERDICT="PASSED — a fresh second capture matches these baselines under CI rendering."
          else
            VERDICT="FAILED (exit ${VERIFY_STATUS}) — do NOT merge these baselines; read the run log. Non-identical baselines turn every later CI run red on its own."
          fi
          {
            echo "Baselines refreshed by the 'Refresh Visual Baselines' workflow."
            echo
            echo "Reason: ${{ inputs.reason || 'push to a ci/refresh-baselines* branch' }}"
            echo "Renderer: Mesa llvmpipe under Xvfb 400x900x24 (same as ci.yml; intentionally NOT a local Metal capture)"
            echo "Re-check (fresh capture vs the baselines in this commit): ${VERDICT}"
            echo
            echo "Per-screen measurements from the re-check:"
            sed 's/^/  /' /tmp/per_screen.txt 2>/dev/null || echo "  (no per-screen lines found — the suite may not have reached its comparison stage)"
            echo
            echo "How far this change moved each screen (fresh capture vs the baselines this commit"
            echo "replaces, i.e. the size of the visual delta that prompted the refresh):"
            sed 's/^/  /' /tmp/before_screen.txt 2>/dev/null || echo "  (not measured)"
            echo
            echo "Baseline files touched:"
            git status --short Godot/tests/snapshots/baselines || true
          } > /tmp/commit_message.txt
          echo "----- commit body -----"
          cat /tmp/commit_message.txt

      - name: Commit and push refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Godot/tests/snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes: the committed baselines already match this renderer."
            exit 0
          fi
          git commit -F /tmp/commit_message.txt
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload captured screens and diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-snapshots
          # Paths must stay inside the workspace -- upload-artifact rejects absolute paths pointing
          # outside it, which would fail the step that is supposed to preserve the evidence.
          path: |
            Godot/tests/snapshots/*.png
            Godot/tests/snapshots/diffs/*.png
          if-no-files-found: warn

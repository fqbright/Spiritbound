name: Spiritbound CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Full Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      # CRITICAL: every headless test script references global class_name types (SpiritContent,
      # SpiritCombat, SpiritGame, SpiritSave, GutTest, ...), and Godot only resolves those from
      # its own generated cache (Godot/.godot/, gitignored — never committed, so a fresh checkout
      # never has one). Without an import pass first, `godot --headless -s tests/test_runner.gd`
      # fails immediately with "Identifier ... not declared in the current scope" parse errors,
      # before a single test runs. This was previously missing here entirely — every CI run on
      # this repo's history failed this way, in ~10 seconds, without ever actually running the
      # test suite (verified against this repo's own past Actions runs). AGENTS.md's existing
      # "run --editor --quit after adding images" note happens to also fix this for the same
      # reason, but --import is the purpose-built headless equivalent and doesn't need a display.
      - name: Import project (populate class_name cache)
        run: godot --headless --path Godot/ --import

      # The pixel-diff suite (step 8 of --all) regenerates 7 mobile screenshots to compare
      # against committed baselines, and that capture needs a real rendering driver — Godot's
      # --headless dummy driver returns a null image from get_image(), so it can't produce
      # pixels to diff at all. Xvfb gives it a virtual display to render into; Godot then falls
      # back to Mesa's software rasterizer (llvmpipe) with no GPU needed, which is plenty for a
      # handful of one-off captures. ubuntu-latest doesn't ship Xvfb by default.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # --all also runs the chaos monkey, memory/leak profiler, and pixel-diff suites, not just
      # the 3 fast ones. Measured cost of the extra 3 suites is negligible (well under a minute
      # combined), so there's no reason for a human/agent to have to remember `--all` locally —
      # every push and PR gets the full signal for free.
      #
      # The whole script runs under xvfb-run rather than only the pixel-diff step, since it's
      # the simplest way to guarantee DISPLAY is already set by the time that step runs partway
      # through — every other suite runs with --headless regardless and ignores it. The virtual
      # screen must be at least as tall as the game's 390x844 portrait viewport: a shorter one
      # (640x480 was tried while building this) silently misplaces bottom-anchored UI, because
      # anchor math resolves against whatever height the window actually is, not the game's
      # configured resolution — it looked exactly like a real layout bug before that was traced
      # back to the undersized virtual screen instead.
      - name: Run All Test Suites (--all)
        run: |
          chmod +x run_tests.sh
          xvfb-run -a --server-args="-screen 0 400x900x24" ./run_tests.sh --all
